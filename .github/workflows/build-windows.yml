name: "Build Windows PHP"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: php version to compile
        default: '8.5'
        type: choice
        options:
          - '8.5'
      extensions:
        required: true
        description: 'extensions to compile (comma separated)'
        type: string
        default: 'ctype,curl,fileinfo,filter,dom,iconv,mbstring,openssl,phar,gd,intl,pdo,pdo_sqlite,pdo_pgsql,apcu,zip,zlib'
      prefer-binary:
        description: 'prefer pre-built binary libraries (reduce build time)'
        type: boolean
        default: true
      with-upx-pack:
        description: 'pack php.exe with UPX (smaller binary)'
        type: boolean
        default: true
      debug:
        description: 'enable spc debug logs'
        type: boolean
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # libraries required by the gd extension
  SPC_WITH_LIBS: freetype,libjpeg,libavif,libwebp

jobs:
  build:
    name: "Build php-${{ inputs.version }} cli on windows-latest"
    runs-on: windows-latest

    steps:
      - name: "Checkout static-php-cli"
        uses: actions/checkout@v7
        with:
          repository: crazywhalecc/static-php-cli
          ref: v3

      - name: "Setup PHP (for running spc)"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: "Cache composer vendor"
        id: cache-composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install composer dependencies"
        if: steps.cache-composer.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: "Generate hashed key for download cache"
        shell: bash
        run: |
          INPUT_HASH=$(echo "${{ runner.os }}-${{ inputs.version }}-${{ inputs.extensions }}-$SPC_WITH_LIBS" | sha256sum | awk '{print $1}')
          echo "INPUT_HASH=$INPUT_HASH" >> "$GITHUB_ENV"

      - name: "Cache downloaded sources"
        id: cache-download
        uses: actions/cache@v6
        with:
          path: downloads
          key: php-${{ env.INPUT_HASH }}

      - name: "Validate spc"
        run: bin/spc --version

      - name: "Doctor environment"
        run: bin/spc doctor --auto-fix

      - name: "Enable prefer-binary flag"
        if: inputs.prefer-binary == true
        run: echo "SPC_BINARY=--prefer-binary" >> $env:GITHUB_ENV

      - name: "Enable debug flag"
        if: inputs.debug == true
        run: echo "SPC_DEBUG=--debug" >> $env:GITHUB_ENV

      - name: "Download PHP and dependencies"
        if: steps.cache-download.outputs.cache-hit != 'true'
        run: bin/spc download --with-php="${{ inputs.version }}" --for-extensions="${{ inputs.extensions }}" --for-libs="${{ env.SPC_WITH_LIBS }}" ${{ env.SPC_BINARY }} ${{ env.SPC_DEBUG }}

      # NOTE: do not pass --with-upx-pack to spc build: UPX runs in-place and is
      # flaky on GitHub Windows runners (Defender locks php.exe), and SPC treats
      # an UPX failure as a fatal build error. Compression is a separate step below
      # with backup/restore so a failed pack never loses the built binary.
      - name: "Build php.exe (cli only)"
        run: bin/spc build --build-cli "${{ inputs.extensions }}" --with-libs="${{ env.SPC_WITH_LIBS }}" ${{ env.SPC_DEBUG }}

      - name: "Resolve built PHP version"
        id: phpinfo
        run: |
          $PHPINFO = bin/spc dev:info php --json --no-ansi --no-motd | ConvertFrom-Json
          $PHPVER = $PHPINFO.cache.source.info.version
          if (-not $PHPVER) {
            throw "Cannot resolve PHP version from dev:info php --json"
          }
          echo "PHPVER=$PHPVER" >> $env:GITHUB_OUTPUT

      - name: "Install UPX"
        if: inputs.with-upx-pack == true
        run: bin/spc install-pkg upx

      - name: "Pack php.exe with UPX (fallback to uncompressed on failure)"
        if: inputs.with-upx-pack == true
        run: |
          $php = "buildroot\bin\php.exe"
          $bak = "buildroot\bin\php.exe.bak"
          $upx = Get-ChildItem -Path pkgroot -Filter upx.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $upx) {
            throw "upx.exe not found under pkgroot"
          }
          Copy-Item $php $bak -Force
          & $upx.FullName --best $php
          $packOk = ($LASTEXITCODE -eq 0)
          if ($packOk) {
            & $php -v
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Packed php.exe fails to run, falling back to uncompressed binary"
              $packOk = $false
            }
          }
          if ($packOk) {
            Remove-Item -Force $bak
          } else {
            Write-Warning "UPX packing failed, keeping the uncompressed php.exe"
            Move-Item -Force $bak $php
          }

      - name: "Smoke test php.exe"
        run: |
          buildroot\bin\php.exe -v
          buildroot\bin\php.exe -m

      - name: "Upload php.exe artifact"
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ steps.phpinfo.outputs.PHPVER }}-win64-cli
          path: buildroot/bin/php.exe
          if-no-files-found: error
