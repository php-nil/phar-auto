name: "Build Windows PHP"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: php version to compile
        default: '8.5'
        type: choice
        options:
          - '8.5'
      extensions:
        required: true
        description: 'extensions to compile (comma separated)'
        type: string
        default: 'ctype,curl,fileinfo,filter,dom,iconv,mbstring,openssl,phar,gd,intl,pdo,pdo_sqlite,pdo_pgsql,apcu,zip,zlib'
      prefer-pre-built:
        description: 'prefer pre-built libraries (reduce build time)'
        type: boolean
        default: true
      with-upx-pack:
        description: 'pack php.exe with UPX (smaller binary)'
        type: boolean
        default: true
      debug:
        description: 'enable spc debug logs'
        type: boolean
        default: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # libraries required by the gd extension
  SPC_WITH_LIBS: freetype,libjpeg,libavif,libwebp

jobs:
  build:
    name: "Build php-${{ inputs.version }} cli on windows-latest"
    runs-on: windows-latest

    steps:
      - name: "Checkout static-php-cli"
        if: github.repository != 'crazywhalecc/static-php-cli'
        uses: actions/checkout@v7
        with:
          repository: crazywhalecc/static-php-cli
          ref: v3

      - name: "Setup PHP (for running spc)"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer
          extensions: curl, openssl, mbstring, filter
          ini-values: memory_limit=-1

      - name: "Cache composer vendor"
        id: cache-composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "Install composer dependencies"
        if: steps.cache-composer.outputs.cache-hit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: "Generate hashed key for download cache"
        shell: bash
        run: |
          INPUT_HASH=$(echo "${{ runner.os }}-${{ inputs.version }}-${{ inputs.extensions }}-${{ env.SPC_WITH_LIBS }}" | sha256sum | awk '{print $1}')
          echo "INPUT_HASH=$INPUT_HASH" >> "$GITHUB_ENV"

      - name: "Cache downloaded sources"
        id: cache-download
        uses: actions/cache@v6
        with:
          path: downloads
          key: php-${{ env.INPUT_HASH }}

      - name: "Validate spc"
        run: bin/spc --version

      - name: "Doctor environment"
        run: bin/spc doctor

      - name: "Enable pre-built libraries flag"
        if: inputs.prefer-pre-built == true
        run: echo "SPC_PRE_BUILT=--prefer-pre-built" >> $env:GITHUB_ENV

      - name: "Enable debug flag"
        if: inputs.debug == true
        run: echo "SPC_DEBUG=--debug" >> $env:GITHUB_ENV

      - name: "Enable UPX pack flag"
        if: inputs.with-upx-pack == true
        run: echo "SPC_UPX=--with-upx-pack" >> $env:GITHUB_ENV

      - name: "Install UPX"
        if: inputs.with-upx-pack == true
        run: bin/spc install-pkg upx

      - name: "Download PHP and dependencies"
        if: steps.cache-download.outputs.cache-hit != 'true'
        run: bin/spc download --with-php="${{ inputs.version }}" --for-extensions="${{ inputs.extensions }}" --with-libs="${{ env.SPC_WITH_LIBS }}" ${{ env.SPC_PRE_BUILT }} ${{ env.SPC_DEBUG }}

      - name: "Build php.exe (cli only)"
        run: bin/spc build --build-cli "${{ inputs.extensions }}" --with-libs="${{ env.SPC_WITH_LIBS }}" ${{ env.SPC_DEBUG }} ${{ env.SPC_UPX }}

      - name: "Resolve built PHP version"
        id: phpinfo
        run: |
          $PHPINFO = bin/spc dev:info php --json --no-ansi | ConvertFrom-Json
          $PHPVER = $PHPINFO.cache.source.info.version
          if (-not $PHPVER) {
            throw "Cannot resolve PHP version from dev:info php --json"
          }
          echo "PHPVER=$PHPVER" >> $env:GITHUB_OUTPUT

      - name: "Smoke test php.exe"
        run: |
          buildroot\bin\php.exe -v
          buildroot\bin\php.exe -m

      - name: "Upload php.exe artifact"
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ steps.phpinfo.outputs.PHPVER }}-win64-cli
          path: buildroot/bin/php.exe
          if-no-files-found: error
