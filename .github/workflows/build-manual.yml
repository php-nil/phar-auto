name: Manual Build Phar

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (used for tarball filename)'
        required: true
        default: 'custom'
        type: string
      artifact_name:
        description: 'Artifact download name'
        required: true
        default: 'phar-build-output'
        type: string
      composer_json_mode:
        description: 'How to provide composer.json'
        required: true
        default: 'url'
        type: choice
        options:
          - url
          - inline
      composer_json_url:
        description: 'composer.json URL (mode=url) - recommended for multi-line JSON'
        required: false
        type: string
      composer_json_content:
        description: 'composer.json content (mode=inline, single-line JSON only)'
        required: false
        type: string
      nil_json_mode:
        description: 'How to provide nil.json'
        required: true
        default: 'url'
        type: choice
        options:
          - url
          - inline
      nil_json_url:
        description: 'nil.json URL (mode=url) - recommended for multi-line JSON'
        required: false
        type: string
      nil_json_content:
        description: 'nil.json content (mode=inline, single-line JSON only)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      PKG: ${{ inputs.package_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.composer_json_mode }}" = "inline" ] && [ -z "${{ inputs.composer_json_content }}" ]; then
            echo "::error::composer_json_content is required when composer_json_mode=inline"
            exit 1
          fi
          if [ "${{ inputs.composer_json_mode }}" = "url" ] && [ -z "${{ inputs.composer_json_url }}" ]; then
            echo "::error::composer_json_url is required when composer_json_mode=url"
            exit 1
          fi
          if [ "${{ inputs.nil_json_mode }}" = "inline" ] && [ -z "${{ inputs.nil_json_content }}" ]; then
            echo "::error::nil_json_content is required when nil_json_mode=inline"
            exit 1
          fi
          if [ "${{ inputs.nil_json_mode }}" = "url" ] && [ -z "${{ inputs.nil_json_url }}" ]; then
            echo "::error::nil_json_url is required when nil_json_mode=url"
            exit 1
          fi

      - name: Create build directory
        run: mkdir -p "$BUILD_DIR" "$BUILD_DIR/output"

      - name: Provide composer.json
        run: |
          set -euo pipefail
          if [ "${{ inputs.composer_json_mode }}" = "inline" ]; then
            printf '%s' '${{ inputs.composer_json_content }}' > "$BUILD_DIR/composer.json"
          else
            curl -fL --retry 3 -o "$BUILD_DIR/composer.json" "${{ inputs.composer_json_url }}"
          fi
          echo "--- composer.json ---"
          cat "$BUILD_DIR/composer.json"
          echo
          echo "--------------------"

      - name: Provide nil.json
        run: |
          set -euo pipefail
          if [ "${{ inputs.nil_json_mode }}" = "inline" ]; then
            printf '%s' '${{ inputs.nil_json_content }}' > "$BUILD_DIR/nil.json"
          else
            curl -fL --retry 3 -o "$BUILD_DIR/nil.json" "${{ inputs.nil_json_url }}"
          fi
          echo "--- nil.json ---"
          cat "$BUILD_DIR/nil.json"
          echo
          echo "-----------------"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: phar
          ini-values: phar.readonly=0
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ${{ env.BUILD_DIR }}

      - name: Download nilpack.phar
        run: curl -fL --retry 3 -o nilpack.phar https://github.com/php-nil/nilpack/releases/latest/download/nilpack.phar
        working-directory: ${{ env.BUILD_DIR }}

      - name: Build phar
        run: php nilpack.phar composer
        working-directory: ${{ env.BUILD_DIR }}

      - name: List built artifacts
        run: ls -la nil-phar-runtime/
        working-directory: ${{ env.BUILD_DIR }}

      - name: Collect output files
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          phars=(nil-phar-runtime/*.phar)
          if [ ${#phars[@]} -eq 0 ]; then
            echo "::error::No .phar file produced in nil-phar-runtime/"
            exit 1
          fi
          cp -v "${phars[@]}" output/
          tar -czf "output/${PKG}.tar.gz" -C nil-phar-runtime vendor
          echo "--- output/ ---"
          ls -la output/
          echo "---------------"

      - name: Upload phar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-phar
          path: build/output/*.phar
          if-no-files-found: error
          retention-days: 30

      - name: Upload vendor tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_name }}-vendor
          path: build/output/${{ inputs.package_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
