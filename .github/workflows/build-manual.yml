name: Manual Build Phar

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (used for tarball filename)'
        required: true
        default: 'custom'
        type: string
      json_mode:
        description: 'How to provide composer.json and nil.json (url=download, json=inline content)'
        required: true
        default: 'url'
        type: choice
        options:
          - url
          - json
      composer_json:
        description: 'composer.json - URL when mode=url, JSON content when mode=json (single-line)'
        required: true
        type: string
      nil_json:
        description: 'nil.json - URL when mode=url, JSON content when mode=json (single-line)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build
      PKG: ${{ inputs.package_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create build directory
        run: mkdir -p "$BUILD_DIR" "$BUILD_DIR/output"

      - name: Provide composer.json
        env:
          JSON_MODE: ${{ inputs.json_mode }}
          JSON_VALUE: ${{ inputs.composer_json }}
        run: |
          set -euo pipefail
          if [ "$JSON_MODE" = "url" ]; then
            curl -fL --retry 3 -o "$BUILD_DIR/composer.json" "$JSON_VALUE"
          else
            printf '%s' "$JSON_VALUE" > "$BUILD_DIR/composer.json"
          fi
          echo "--- composer.json ---"
          cat "$BUILD_DIR/composer.json"
          echo
          echo "--------------------"

      - name: Provide nil.json
        env:
          JSON_MODE: ${{ inputs.json_mode }}
          JSON_VALUE: ${{ inputs.nil_json }}
        run: |
          set -euo pipefail
          if [ "$JSON_MODE" = "url" ]; then
            curl -fL --retry 3 -o "$BUILD_DIR/nil.json" "$JSON_VALUE"
          else
            printf '%s' "$JSON_VALUE" > "$BUILD_DIR/nil.json"
          fi
          echo "--- nil.json ---"
          cat "$BUILD_DIR/nil.json"
          echo
          echo "-----------------"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: phar
          ini-values: phar.readonly=0
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ${{ env.BUILD_DIR }}

      - name: Download nilpack.phar
        run: curl -fL --retry 3 -o nilpack.phar https://github.com/php-nil/nilpack/releases/latest/download/nilpack.phar
        working-directory: ${{ env.BUILD_DIR }}

      - name: Build phar
        run: php nilpack.phar composer
        working-directory: ${{ env.BUILD_DIR }}

      - name: List built artifacts
        run: ls -la nil-phar-runtime/
        working-directory: ${{ env.BUILD_DIR }}

      - name: Collect output files
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          phars=(nil-phar-runtime/*.phar)
          if [ ${#phars[@]} -eq 0 ]; then
            echo "::error::No .phar file produced in nil-phar-runtime/"
            exit 1
          fi
          cp -v "${phars[@]}" output/
          tar -czf "output/${PKG}.tar.gz" -C nil-phar-runtime vendor
          echo "--- output/ ---"
          ls -la output/
          echo "---------------"

      - name: Upload phar artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_name }}-phar.zip
          path: build/output/*.phar
          if-no-files-found: error
          retention-days: 30

      - name: Upload vendor tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_name }}-vendor.zip
          path: build/output/${{ inputs.package_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
