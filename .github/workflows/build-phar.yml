name: Build other Phar

on:
  release:
    types: [ created ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # 每天 UTC 19:00 = 北京时间次日 03:00
    - cron: '0 19 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: [ http, uid ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: phar
          ini-values: phar.readonly=0
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./src/${{ matrix.package }}

      - name: Download nilpack.phar
        run: curl -fL --retry 3 -o nilpack.phar https://github.com/php-nil/nilpack/releases/latest/download/nilpack.phar
        working-directory: ./src/${{ matrix.package }}

      - name: Build phar
        run: php nilpack.phar composer
        working-directory: ./src/${{ matrix.package }}

      - name: List built artifacts
        run: ls -la nil-phar-runtime/
        working-directory: ./src/${{ matrix.package }}

      - name: Package vendor as ${{ matrix.package }}.tar.gz
        run: tar -czf ${{ matrix.package }}.tar.gz -C nil-phar-runtime vendor
        working-directory: ./src/${{ matrix.package }}

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.package }} phar and tarball to release
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          working_directory: src/${{ matrix.package }}
          files: |
            nil-phar-runtime/*.phar
            ${{ matrix.package }}.tar.gz
