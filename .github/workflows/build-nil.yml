name: Build Nil Phar

on:
  release:
    types: [ created ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    # 每天 UTC 19:00 = 北京时间次日 03:00
    - cron: '0 19 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: phar
          ini-values: phar.readonly=0
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./src/nil

      - name: Download nilpack.phar
        run: curl -fL --retry 3 -o nilpack.phar https://github.com/php-nil/nilpack/releases/latest/download/nilpack.phar
        working-directory: ./src/nil

      - name: Download Nil.php
        run: curl -fL --retry 3 -o Nil.php https://github.com/php-nil/nil/releases/latest/download/Nil.php
        working-directory: ./src/nil

      - name: Build phar
        run: php nilpack.phar composer
        working-directory: ./src/nil

      - name: List built artifacts
        run: ls -la nil-phar-runtime/
        working-directory: ./src/nil

      - name: Package vendor as nil.tar.gz
        run: tar -czf nil.tar.gz -C nil-phar-runtime vendor
        working-directory: ./src/nil

      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || echo "")
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload phar and nil.gz to release
        if: ${{ steps.tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          working_directory: src/nil
          files: |
            nil-phar-runtime/*.phar
            nil.tar.gz
